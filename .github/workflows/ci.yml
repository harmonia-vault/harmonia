name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI 的结构见 docs/rewrite-plan.md“自动化回归”。同一分支有新的推送时，取消还在跑的旧运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 按改动的路径决定跑哪些任务；改了 CI 或工具版本时全部都跑，只改文档时都不跑。
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli == 'true' || steps.filter.outputs.ci == 'true' }}
      server: ${{ steps.filter.outputs.server == 'true' || steps.filter.outputs.ci == 'true' }}
      relay: ${{ steps.filter.outputs.relay == 'true' || steps.filter.outputs.ci == 'true' }}
      app: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.ci == 'true' }}
      e2e: ${{ steps.filter.outputs.cli == 'true' || steps.filter.outputs.server == 'true' || steps.filter.outputs.relay == 'true' || steps.filter.outputs.app == 'true' || steps.filter.outputs.e2e == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: ['.github/workflows/ci.yml', '.github/workflows/release.yml', '.github/workflows/testflight.yml', 'mise.toml']
            cli: ['cli/**']
            server: ['server/**']
            relay: ['relay/**']
            app: ['app/**']
            e2e: ['e2e/**']

  # 工具版本一律从 mise.toml 读取；每个任务只装自己用到的工具，缓存按任务分开。
  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: go
          cache_key_prefix: mise-cli
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}
      - name: 测试
        working-directory: cli
        run: |
          go vet ./...
          go test ./...
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/harmonia

  cli-windows:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: go
          cache_key_prefix: mise-cli-windows
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}
      - name: 测试
        working-directory: cli
        run: |
          go vet ./...
          go test ./...

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
          cache_key_prefix: mise-server
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('server/pnpm-lock.yaml') }}
      - name: 测试
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
          cache_key_prefix: mise-relay
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('relay/pnpm-lock.yaml') }}
      - name: 测试
        working-directory: relay
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm exec wrangler deploy --dry-run --outdir /tmp/relay-dry-run

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: flutter
          cache_key_prefix: mise-app
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - name: 分析与测试
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/core

  ios:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: flutter python
          cache_key_prefix: mise-ios
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - name: 验证签名配置
        run: mise run test-ios-signing
      - name: 无签名构建
        working-directory: app
        run: |
          flutter pub get
          mise run build-ios --dart-define=APPLE_DISTRIBUTION=false
          mise run build-ios --dart-define=APPLE_DISTRIBUTION=true

  # 与各单元测试并行，不等它们结束。
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: go node pnpm flutter
          cache_key_prefix: mise-e2e
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.local/share/pnpm/store
            ~/.pub-cache
          key: e2e-${{ runner.os }}-${{ hashFiles('cli/go.sum', 'server/pnpm-lock.yaml', 'relay/pnpm-lock.yaml', 'app/pubspec.lock') }}
      - name: 端到端流程
        run: |
          (cd server && pnpm install --frozen-lockfile)
          (cd relay && pnpm install --frozen-lockfile)
          (cd app && flutter pub get)
          bash e2e/run.sh
