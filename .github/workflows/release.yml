name: Release

# 推送 v* 标签时发布：CLI 四个平台二进制、签名 APK、签名清单。服务端由 publish-server.yml 发布到 harmonia-worker。
# 带“-”的版本（例如 v0.1.2-rc.1、v0.1.2-beta.1）发布为预发布，只进入测试版渠道。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: 构建
        working-directory: cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "../dist/harmonia-${target%/*}-${target#*/}" ./cmd/harmonia
          done
          cp install.sh ../dist/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: 写入签名配置
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > key.properties <<EOF
          storeFile=$PWD/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=harmonia
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - name: 构建 APK
        working-directory: app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          # versionCode 与版本顺序一致：基础版本 ×100 + 后缀分（alpha N → N，beta N → 20+N，rc N → 50+N，正式版 → 99）。
          # 例如 0.1.2-beta.1 → 10221，0.1.2-rc.1 → 10251，0.1.2 → 10299。
          PRE="${VERSION#"$BASE"}"; PRE="${PRE#-}"
          KIND=$(echo "$PRE" | sed 's/[0-9.]*$//'); NUM=$(echo "$PRE" | sed 's/^[a-z]*\.\{0,1\}//'); NUM=${NUM:-0}
          case "$KIND" in
            "") SUB=99 ;;
            rc) SUB=$((50 + NUM)) ;;
            beta) SUB=$((20 + NUM)) ;;
            *) SUB=$NUM ;;
          esac
          CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + SUB ))
          echo "versionCode=$CODE"
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-name "$BASE" --build-number "$CODE" \
            --dart-define=APP_VERSION="$VERSION"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/harmonia-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: [cli, apk]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成签名清单并发布
        env:
          HARMONIA_RELEASE_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | head -20)
          (cd cli && go run ./cmd/releasetool manifest --version "$VERSION" --dist ../dist --base-url "$URL" --notes "$NOTES")
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Harmonia $VERSION" --notes "${NOTES:-Harmonia $VERSION}" $FLAGS
      - name: 更新渠道清单
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # update-feed 是固定的预发布，存放 stable.json 与 beta.json；标为预发布，不会成为“最新版本”。
          if ! gh release view update-feed >/dev/null 2>&1; then
            gh release create update-feed --prerelease --target main --title "更新源" \
              --notes "App 与命令行检查更新时读取这里的 stable.json（正式版）和 beta.json（测试版）。请勿删除。"
          fi
          mkdir -p feed
          gh release download update-feed -D feed -p '*.json*' || true
          (cd cli && go run ./cmd/releasetool feed --version "${GITHUB_REF_NAME#v}" --dist ../dist --feed ../feed)
          cp dist/install.sh feed/install.sh
          gh release upload update-feed feed/* --clobber
