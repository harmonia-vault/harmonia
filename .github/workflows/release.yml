name: Release

# 推送 v* 标签时发布：CLI 四个平台二进制、签名 APK、签名清单。服务端由 publish-server.yml 发布到 harmonia-worker。
# 带“-”的版本（例如 v0.1.0-rc.1）发布为预发布，不会被 App 和 CLI 的自动更新选中。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: 构建
        working-directory: cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "../dist/harmonia-${target%/*}-${target#*/}" ./cmd/harmonia
          done
          cp install.sh ../dist/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: 写入签名配置
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > key.properties <<EOF
          storeFile=$PWD/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=harmonia
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - name: 构建 APK
        working-directory: app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          # versionCode 单调递增：0.1.0-rc.1 → 10001，0.1.0 → 10099，0.1.1 → 10199。
          case "$VERSION" in
            *-*) SUFFIX=$(echo "$VERSION" | sed 's/.*[^0-9]\([0-9]*\)$/\1/'); SUFFIX=${SUFFIX:-1} ;;
            *) SUFFIX=99 ;;
          esac
          CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + SUFFIX ))
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-name "$BASE" --build-number "$CODE" \
            --dart-define=APP_VERSION="$VERSION"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/harmonia-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: [cli, apk]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成签名清单并发布
        env:
          HARMONIA_RELEASE_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | head -20)
          (cd cli && go run ./cmd/releasetool manifest --version "$VERSION" --dist ../dist --base-url "$URL" --notes "$NOTES")
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Harmonia $VERSION" --notes "${NOTES:-Harmonia $VERSION}" $FLAGS
