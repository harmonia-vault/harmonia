name: Release

# 推送 v* 标签时发布：CLI 六个平台二进制、签名 APK、未签名 IPA、签名清单。服务端由 publish-server.yml 发布到 harmonia-worker。
# 测试版也支持推送 release/v*-rc.*、release/v*-beta.*、release/v*-alpha.* 分支；全部构建成功后才创建标签和发布。
# 带“-”的版本（例如 v0.1.2-rc.1、v0.1.2-beta.1）发布为预发布，只进入测试版渠道。
on:
  push:
    tags: ['v*']
    branches: ['release/v*-rc.*', 'release/v*-beta.*', 'release/v*-alpha.*']

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 服务端的版本号写在 server/package.json 里，不像 CLI 和 App 那样在构建时从标签取；这里拦住忘记改的情况。
      - name: 核对服务端版本号
        run: |
          WANT="${GITHUB_REF_NAME#release/}"
          WANT="${WANT#v}"
          WANT="${WANT%%-*}"
          HAVE="$(jq -r .version server/package.json)"
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::server/package.json 的版本号是 $HAVE，与标签 $GITHUB_REF_NAME 不一致。请先把它改成 $WANT 并合并到 main，再重新打标签。"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: 构建
        working-directory: cli
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          VERSION="${TAG#v}"
          mkdir -p ../dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/arm64 windows/amd64; do
            ext=""
            case "$target" in windows/*) ext=".exe" ;; esac
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "../dist/harmonia-${target%/*}-${target#*/}$ext" ./cmd/harmonia
          done
          cp install.sh install.ps1 ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: 写入签名配置
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > key.properties <<EOF
          storeFile=$PWD/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=harmonia
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - name: 构建 APK
        working-directory: app
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          VERSION="${TAG#v}"
          read -r BASE CODE <<< "$(bash tool/build-number.sh "$VERSION")"
          echo "versionCode=$CODE"
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --build-name "$BASE" --build-number "$CODE" \
            --dart-define=APP_VERSION="$VERSION"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../dist/harmonia-$VERSION-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../dist/harmonia-$VERSION-android-arm.apk"
      - name: 检查分包架构
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          from zipfile import ZipFile
          version = os.environ['GITHUB_REF_NAME'].removeprefix('release/').removeprefix('v')
          code = subprocess.check_output(['bash', 'app/tool/build-number.sh', version], text=True).split()[1]
          aapt = sorted(Path(os.environ['ANDROID_HOME']).glob('build-tools/*/aapt'))[-1]
          for arch, abi in [('arm64', 'arm64-v8a'), ('arm', 'armeabi-v7a')]:
              [apk] = Path('dist').glob(f'*-android-{arch}.apk')
              with ZipFile(apk) as z:
                  libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
                  assert {n.split('/')[1] for n in libs} == {abi}, apk
                  assert f'lib/{abi}/libflutter.so' in libs, apk
                  assert f'lib/{abi}/libapp.so' in libs, apk
              badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
              assert re.search(r"versionCode='([^']+)'", badging).group(1) == code, badging
              subprocess.run([str(aapt.with_name('apksigner')), 'verify', str(apk)], check=True)
              print(f'{apk.name}: {apk.stat().st_size / 1024 / 1024:.2f} MiB，仅 {abi}，构建号 {code}，签名有效')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

  # 未签名的 IPA：由使用者用自己的证书或签名工具签名后安装。
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: 构建 IPA
        working-directory: app
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          VERSION="${TAG#v}"
          read -r BASE CODE <<< "$(bash tool/build-number.sh "$VERSION")"
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-name "$BASE" --build-number "$CODE" \
            --dart-define=APP_VERSION="$VERSION"
          mkdir -p ../dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "../dist/harmonia-$VERSION.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: [cli, apk, ipa]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成签名清单并发布
        env:
          HARMONIA_RELEASE_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          VERSION="${TAG#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # checkout 会把附注标签替换成轻量标签，重新拉取以读取标签说明。
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            NOTES=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" | sed '/^-----BEGIN/,$d' | head -20)
          else
            # 发布分支固定到本次构建的提交；发布说明取提交正文。
            NOTES=$(git log -1 --format=%B "$GITHUB_SHA" | head -20)
          fi
          (cd cli && go run ./cmd/releasetool manifest --version "$VERSION" --dist ../dist --base-url "$URL" --notes "$NOTES")
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Harmonia $VERSION" --notes "${NOTES:-Harmonia $VERSION}" $FLAGS
      - name: 更新渠道清单
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # update-feed 是固定的预发布，存放 stable.json 与 beta.json；标为预发布，不会成为“最新版本”。
          if ! gh release view update-feed >/dev/null 2>&1; then
            gh release create update-feed --prerelease --target main --title "更新源" \
              --notes "App 与命令行检查更新时读取这里的 stable.json（正式版）和 beta.json（测试版）。请勿删除。"
          fi
          mkdir -p feed
          gh release download update-feed -D feed -p '*.json*' || true
          TAG="${GITHUB_REF_NAME#release/}"
          (cd cli && go run ./cmd/releasetool feed --version "${TAG#v}" --dist ../dist --feed ../feed)
          cp dist/install.sh dist/install.ps1 feed/
          gh release upload update-feed feed/* --clobber
