[tools]
bun = "1.3.14"

[tasks.svg]
description = "从生成器重新写出全部 SVG 源文件"
run = ["bun build-envsync.mjs", "bun build-sketch.mjs", "bun build-styles.mjs", "bun build.mjs"]

[tasks.app-icon]
description = "把手绘「.env 同步」图标导出到手机端 iOS / Android 工程"
run = ["bun install --frozen-lockfile", "bun export-app-icon.mjs"]
