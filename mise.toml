[tools]
go = "1.26.4"
node = "24.16.0"
pnpm = "11.5.2"
flutter = "3.47.6"
java = "temurin-17.0.16+8"
android-sdk = "19.0"
cmake = "3.31.8"
bun = "1.3.14"

[env]
ANDROID_HOME = "{{env.HOME}}/.local/share/mise/installs/android-sdk/19.0"
FLUTTER_SUPPRESS_ANALYTICS = "true"

[tasks.vectors]
description = "由 Go 实现重新生成三端共用测试向量"
dir = "cli"
run = "go run ./internal/crypto/vectorgen ../vectors"

[tasks.test-cli]
description = "CLI 单元测试"
dir = "cli"
run = "go test ./..."

[tasks.check-cli]
description = "CLI 静态检查"
dir = "cli"
run = "go vet ./..."

[tasks.fmt-cli]
description = "格式化 CLI 代码"
dir = "cli"
run = "go fmt ./..."

[tasks.test-shell-linux]
description = "验证 Bash、Zsh 的最低支持版本及 Bash 5.2.21"
dir = "cli"
run = '''
set -eu
test_dir=$(mktemp -d)
trap 'rm -rf "$test_dir"' EXIT
GOOS=linux CGO_ENABLED=0 go test -c -o "$test_dir/shell.test" ./internal/shell
for bash_version in 5.1.16 5.2.21; do
  docker run --rm -v "$test_dir:/tests:ro" "bash:$bash_version" /tests/shell.test -test.v
done
GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$test_dir/shell-zsh.test" ./internal/shell
docker run --rm --platform linux/amd64 -v "$test_dir:/tests:ro" --entrypoint /tests/shell-zsh.test zshusers/zsh:5.0.0 -test.v
'''

[tasks.test-server]
description = "服务端单元测试"
dir = "server"
run = "pnpm test"

[tasks.test-app]
description = "App 核心（纯 Dart）单元测试"
dir = "app"
run = "flutter test test/core"

[tasks.test]
description = "全部单元测试"
depends = ["test-cli", "test-server", "test-app"]

[tasks.e2e]
description = "端到端流程测试：本地 workerd 服务端 + 真实 CLI + 无界面管理脚本"
run = "bash e2e/run.sh"

[tasks.build-cli]
description = "构建当前平台的 CLI"
dir = "cli"
run = "go build -o bin/harmonia ./cmd/harmonia"

[tasks.build-apk]
description = "构建 Android Release APK"
dir = "app"
run = "flutter build apk --release"

[tasks.dev-server]
description = "本地运行服务端（workerd）"
dir = "server"
run = "pnpm dev"

[tasks.app-icon]
description = "把 design/icons 的手绘图标导出到 Android 工程"
dir = "design/icons"
run = ["bun install --frozen-lockfile", "bun export-app-icon.mjs"]

[tasks.publish-server]
description = "手动把 server/ 发布到 harmonia-vault/harmonia-worker（正常由 CI 在打正式标签时发布）"
run = [
  "git subtree split --prefix server -b server-release",
  "git push https://github.com/harmonia-vault/harmonia-worker.git server-release:main",
  "git branch -D server-release",
]
