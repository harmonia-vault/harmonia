[tools]
go = "1.26.4"
node = "24.16.0"
pnpm = "11.5.2"
flutter = "3.47.6"
java = "temurin-17.0.16+8"
android-sdk = "19.0"
cmake = "3.31.8"
bun = "1.3.14"
python = "3.13.14"

[env]
# 已经设置了 ANDROID_HOME 时沿用（CI 的 runner 自带完整 SDK），否则用 mise 安装的 SDK。
# Windows 上没有 HOME（CI 的 Windows 任务也会读这个文件），取不到时用 USERPROFILE。
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=get_env(name='HOME', default=get_env(name='USERPROFILE', default='')) ~ '/.local/share/mise/installs/android-sdk/19.0') }}"
FLUTTER_SUPPRESS_ANALYTICS = "true"

[tasks.vectors]
description = "由 Go 实现重新生成三端共用测试向量"
dir = "cli"
run = "go run ./internal/crypto/vectorgen ../vectors"

[tasks.test-cli]
description = "CLI 单元测试"
dir = "cli"
run = "go test ./..."

[tasks.check-cli]
description = "CLI 静态检查"
dir = "cli"
run = "go vet ./..."

[tasks.check-cli-windows]
description = "CLI 的 Windows 部分静态检查（交叉编译，不需要 Windows）"
dir = "cli"
run = "GOOS=windows go vet ./..."

[tasks.test-installer-linux]
description = "在 Linux Bash、Zsh 中验证安装脚本和 PATH 配置"
dir = "cli"
run = '''
set -eu
test_dir=$(mktemp -d)
trap 'rm -rf "$test_dir"' EXIT
GOOS=linux CGO_ENABLED=0 go test -c -o "$test_dir/installer.test" .
cp install.sh "$test_dir/install.sh"
docker run --rm -v "$test_dir:/tests:ro" -w /tests bash:5.2.21 sh -c 'apk add --no-cache curl zsh >/dev/null && ./installer.test -test.v'
'''

[tasks.fmt-cli]
description = "格式化 CLI 代码"
dir = "cli"
run = "go fmt ./..."

[tasks.test-shell-linux]
description = "验证 Bash、Zsh 的最低支持版本及 Bash 5.2.21"
dir = "cli"
run = '''
set -eu
test_dir=$(mktemp -d)
trap 'rm -rf "$test_dir"' EXIT
GOOS=linux CGO_ENABLED=0 go test -c -o "$test_dir/shell.test" ./internal/shell
for bash_version in 5.1.16 5.2.21; do
  docker run --rm -v "$test_dir:/tests:ro" "bash:$bash_version" /tests/shell.test -test.v
done
GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$test_dir/shell-zsh.test" ./internal/shell
docker run --rm --platform linux/amd64 -v "$test_dir:/tests:ro" --entrypoint /tests/shell-zsh.test zshusers/zsh:5.0.0 -test.v
'''

[tasks.test-server]
description = "服务端单元测试"
dir = "server"
run = "pnpm test"

[tasks.test-relay]
description = "推送中继单元测试"
dir = "relay"
run = "pnpm test"

[tasks.test-app]
description = "App 核心（纯 Dart）单元测试"
dir = "app"
run = "flutter test test/core"

[tasks.deps-app]
description = "解析 App 依赖"
dir = "app"
run = "flutter pub get"

[tasks.check-app]
description = "App 静态检查"
dir = "app"
run = "flutter analyze"

[tasks.fmt-app]
description = "格式化指定的 App 源文件"
dir = "app"
run = "dart format --line-length 120"

[tasks.run-app]
description = "在指定设备运行 App"
dir = "app"
run = "flutter run"

[tasks.test]
description = "全部单元测试"
depends = ["test-cli", "test-server", "test-relay", "test-app"]

[tasks.e2e]
description = "端到端流程测试：本地 workerd 服务端 + 真实 CLI + 无界面管理脚本"
run = "bash e2e/run.sh"

[tasks.build-cli]
description = "构建当前平台的 CLI"
dir = "cli"
run = "go build -o bin/harmonia ./cmd/harmonia"

[tasks.build-apk]
description = "构建 Android ARM64 与 ARM32 分架构 Release APK"
dir = "app"
run = "flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64"

[tasks.build-ipa]
description = "构建未签名的 iOS IPA（自行签名后安装）"
dir = "app"
run = '''
set -eu
flutter build ios --release --no-codesign --dart-define=APPLE_DISTRIBUTION=false
rm -rf build/ios/ipa
mkdir -p build/ios/ipa/Payload
cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
(cd build/ios/ipa && zip -qry harmonia.ipa Payload && rm -rf Payload)
echo "已生成 app/build/ios/ipa/harmonia.ipa"
'''

[tasks.run-ios]
description = "在 iOS 模拟器中运行 App（优先用已启动的模拟器，否则启动第一台 iPhone）"
dir = "app"
run = '''
set -eu
id=$(xcrun simctl list devices booted | grep -m1 -oE '[0-9A-F-]{36}' || true)
if [ -z "$id" ]; then
  id=$(xcrun simctl list devices available | grep iPhone | grep -m1 -oE '[0-9A-F-]{36}')
  xcrun simctl boot "$id"
fi
open -a Simulator
flutter run -d "$id"
'''

[tasks.test-ios]
description = "iOS 原生部分的单元测试（PIN 槽密钥的计算），在模拟器中运行"
dir = "app"
run = '''
set -eu
flutter pub get
id=$(xcrun simctl list devices available | grep iPhone | grep -m1 -oE '[0-9A-F-]{36}')
xcodebuild test -quiet -workspace ios/Runner.xcworkspace -scheme Runner -destination "platform=iOS Simulator,id=$id"
'''

[tasks.dev-server]
description = "本地运行服务端（workerd）"
dir = "server"
run = "pnpm dev"

[tasks.dev-relay]
description = "本地运行推送中继（不连接 APNs、FCM，通知写进日志）"
dir = "relay"
run = "pnpm dev"

[tasks.deploy-relay]
description = "发布者手动部署推送中继（正常由 deploy-relay.yml 在打正式标签时部署）"
dir = "relay"
run = ["pnpm install --frozen-lockfile", "pnpm test", "pnpm run deploy"]

[tasks.app-icon]
description = "把 design/icons 的手绘图标导出到 Android 和 iOS 工程"
dir = "design/icons"
run = ["bun install --frozen-lockfile", "bun export-app-icon.mjs"]

[tasks.publish-server]
description = "手动把 server/ 发布到 harmonia-vault/harmonia-worker（正常由 CI 在打正式标签时发布）"
run = [
  "git subtree split --prefix server -b server-release",
  "git push https://github.com/harmonia-vault/harmonia-worker.git server-release:main",
  "git branch -D server-release",
]

[tasks.prepare-ios-signing]
description = "为 TestFlight 构建准备临时签名配置（仅 GitHub Actions）"
run = "python app/tool/ios_signing.py prepare"

[tasks.clean-ios-signing]
description = "清理 TestFlight 临时签名配置"
run = "python app/tool/ios_signing.py clean"

[tasks.test-ios-signing]
description = "验证 TestFlight 描述文件与导出配置"
run = "python -m unittest discover -s app/tool -p 'test_ios_signing.py'"

[tasks.build-testflight]
description = "构建 TestFlight 内部测试包（需先准备签名配置）"
dir = "app"
run = "flutter build ipa --release --dart-define=APPLE_DISTRIBUTION=true"

[tasks.build-ios]
description = "构建无签名 iOS App，用于验证分发配置"
dir = "app"
run = "flutter build ios --release --no-codesign"

[tasks.build-ios-device]
description = "构建本机签名的 iOS 真机测试包"
dir = "app"
run = "flutter build ios --release --dart-define=APPLE_DISTRIBUTION=true"

[tasks.install-ios-device]
description = "安装已构建的 iOS 真机测试包，使用 --device 指定手机"
run = "xcrun devicectl device install app app/build/ios/iphoneos/Runner.app"

[tasks.run-app-preview]
description = "在设备窗口中运行独立模拟账号，检查正式布局与交互"
dir = "app"
run = "flutter run --target=lib/main_preview.dart"
